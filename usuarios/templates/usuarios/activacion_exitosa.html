{% extends 'usuarios/base_cuenta.html' %}
{% block title %}Cuenta activada{% endblock %}
{% block content %}
  <section class="account-state-card">
    <span class="account-state-icon success"><i class="fa-solid fa-user-check" aria-hidden="true"></i></span>
    <span class="account-state-kicker">Verificación completada</span>
    <h1>Tu cuenta está activa</h1>
    <p>El correo fue confirmado correctamente. Ya puedes iniciar sesión y comenzar a comprar en SFI.</p>
    <a class="account-primary-link" href="{% url 'iniciosesion' %}">Iniciar sesión <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </section>
{% endblock %}
